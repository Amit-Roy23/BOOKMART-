name: Bookmart Backend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test-and-lint:
    name: Lint & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookmart_test_db
          POSTGRES_USER: bookmart_user
          POSTGRES_PASSWORD: bookmart_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Django Tests
        env:
          DEBUG: "True"
          SECRET_KEY: "django-insecure-ci-test-secret-key-do-not-use-in-production"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE: "django.db.backends.postgresql"
          DB_NAME: "bookmart_test_db"
          DB_USER: "bookmart_user"
          DB_PASSWORD: "bookmart_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/0"
          STORAGE_PROVIDER: "local"
        run: uv run python manage.py test
