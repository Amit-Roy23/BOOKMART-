[project]
name = "bookmart-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.89",
    "celery[redis]>=5.4.0",
    "cloudinary>=1.45.0",
    "dj-database-url>=3.1.2",
    "django==6.0.6",
    "django-cloudinary-storage>=0.3.0",
    "django-cors-headers>=4.7.0",
    "django-filter>=25.2",
    "django-import-export>=4.4.1",
    "django-redis>=5.4.0",
    "django-storages>=1.14.6",
    "django-templated-mail>=1.1.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.95.0",
    "drf-spectacular[sidecar]>=0.29.0",
    "gunicorn>=26.0.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "redis>=5.0.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "ruff>=0.15.18",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["apps", "bookmart", "manage.py"]

